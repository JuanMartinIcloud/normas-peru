name: Busquedas guardadas

on:
  workflow_dispatch:

jobs:
  busquedas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash src/reintentar.sh pip install psycopg2-binary requests
      - name: Ejecutar las busquedas guardadas que tocan hoy
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: bash src/reintentar.sh python3 src/busquedas_tarea.py
