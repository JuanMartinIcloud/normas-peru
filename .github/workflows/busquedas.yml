name: Busquedas guardadas

on:
  workflow_dispatch:

jobs:
  busquedas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ejecutar las busquedas guardadas que tocan hoy
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: |
          pip install psycopg2-binary requests >/dev/null
          python3 - <<'PY'
          import os, time, psycopg2, requests
          c = psycopg2.connect(os.environ["DATABASE_URL"]); cur = c.cursor()
          cur.execute("SELECT valor FROM configuracion WHERE clave = 'clave_tareas'")
          fila = cur.fetchone(); c.close()
          if not fila:
              print("::notice::Todavia no hay busquedas guardadas."); raise SystemExit(0)
          for vuelta in range(8):
              r = requests.post("https://normas-peru.vercel.app/api/busquedas/ejecutar", headers={"x-clave-tareas": fila[0]}, timeout=320)
              d = r.json()
              for h in d.get("hechas", []):
                  print(f"::notice title={h['nombre']}::{h['normas']} normas, {h['proyectos']} proyectos, correo enviado: {h['enviado']}")
              if r.status_code != 200:
                  print(f"::error::{d}"); raise SystemExit(1)
              if not d.get("pendientes"):
                  break
              time.sleep(5)
          PY
