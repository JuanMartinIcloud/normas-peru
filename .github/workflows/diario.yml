name: Descarga diaria

on:
  schedule:
    # 03:30 UTC = 22:30 hora de Lima. Descarga el dia anterior y el actual
    # (GitHub a veces la ejecuta con horas de retraso; repasar ayer evita huecos).
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a descargar (YYYY-MM-DD). Vacio = ayer y hoy"
        required: false
        default: ""

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: bash src/reintentar.sh pip install -r requirements.txt
      - name: Descargar normas
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: bash src/reintentar.sh python src/run_dia.py ${{ github.event.inputs.fecha }}
