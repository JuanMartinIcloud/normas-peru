name: Descarga diaria

on:
  schedule:
    # 03:30 UTC = 22:30 hora de Lima (cuando ya salio la edicion del dia)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a descargar (YYYY-MM-DD). Vacio = hoy"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar normas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/run_dia.py ${{ github.event.inputs.fecha }} 2>&1 | tee ultimo_resultado.txt
      - name: Guardar resumen en el repositorio
        run: |
          mkdir -p estado
          cp ultimo_resultado.txt estado/ultimo.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add estado
          git commit -m "Resumen de la ultima descarga" || echo "sin cambios"
          git push
