name: Diagnostico de velocidad de busqueda

on:
  workflow_dispatch:
    inputs:
      q:
        description: "Texto a buscar"
        default: "violencia psicologica"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Medir
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
          TEXTOS_URL_1: ${{ secrets.TEXTOS_URL_1 }}
          TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}
          TEXTOS_URL_3: ${{ secrets.TEXTOS_URL_3 }}
          TEXTOS_URL_5: ${{ secrets.TEXTOS_URL_5 }}
          TEXTOS_URL_6: ${{ secrets.TEXTOS_URL_6 }}
          TEXTOS_URL_7: ${{ secrets.TEXTOS_URL_7 }}
          TEXTOS_URL_8: ${{ secrets.TEXTOS_URL_8 }}
          TEXTOS_URL_9: ${{ secrets.TEXTOS_URL_9 }}
          TEXTOS_URL_10: ${{ secrets.TEXTOS_URL_10 }}
          TEXTOS_URL_11: ${{ secrets.TEXTOS_URL_11 }}
          TEXTOS_URL_12: ${{ secrets.TEXTOS_URL_12 }}
          Q: ${{ github.event.inputs.q }}
          SIN_SEQ: "1"
        run: |
          mkdir -p sondeo_buscador
          if [ "$Q" = "MOVER1" ]; then python src/mover_base1.py > sondeo_buscador/diag.txt 2>&1; elif [ "$Q" = "VERIFICAR" ]; then python src/verificar.py > sondeo_buscador/diag.txt 2>&1; elif [ "$Q" = "REPROCESAR" ]; then python src/reprocesar.py > sondeo_buscador/diag.txt 2>&1; elif [ "$Q" = "INDICES" ]; then python src/diag_indices.py > sondeo_buscador/diag.txt 2>&1; elif [ "$Q" = "ANALIZAR" ]; then python src/analizar.py > sondeo_buscador/diag.txt 2>&1; cat sondeo_buscador/diag.txt; else python src/diag_busqueda.py "$Q"; fi
      - name: Guardar
        run: |
          git config user.name "JuanMartinIcloud"
          git config user.email "282369089+JuanMartinIcloud@users.noreply.github.com"
          git add sondeo_buscador
          git commit -m "Diagnostico de busqueda" || echo "sin cambios"
          git pull --rebase -q && git push
