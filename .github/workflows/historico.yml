name: Carga historica por tandas

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha mas antigua a cubrir (YYYY-MM-DD)"
        default: "2019-01-01"
      max_dias:
        description: "Maximo de dias por tanda"
        default: "400"
  schedule:
    # Una tanda cada 8 horas hasta completar el historico (se reanuda sola)
    - cron: "0 */8 * * *"

concurrency:
  group: historico
  cancel-in-progress: false

jobs:
  tanda:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: el programador la detecta y la repite sola
    continue-on-error: true
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar tanda
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
          ELPERUANO_ENDPOINT: ${{ vars.ELPERUANO_ENDPOINT }}
          ELPERUANO_METODO: ${{ vars.ELPERUANO_METODO }}
          ELPERUANO_PARAM_DESDE: ${{ vars.ELPERUANO_PARAM_DESDE }}
          ELPERUANO_PARAM_HASTA: ${{ vars.ELPERUANO_PARAM_HASTA }}
        run: >
          python src/backfill.py
          --desde "${{ github.event.inputs.desde || '2019-01-01' }}"
          --max-dias "${{ github.event.inputs.max_dias || '400' }}"
          --max-minutos 330
