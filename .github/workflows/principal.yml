name: Cambiar base principal

# Copia la base principal activa a la que menos transferencia gasto este mes y pasa el sistema a usarla.
# Normalmente lo hace solo "Cupos de Neon" (ver src/cambiar_principal.py); este flujo es para hacerlo a mano.
on:
  workflow_dispatch:

concurrency:
  group: cupos
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  cambiar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash src/reintentar.sh pip install requests psycopg2-binary
      - name: Copiar y cambiar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}
          TEXTOS_URL_3: ${{ secrets.TEXTOS_URL_3 }}
          TEXTOS_URL_4: ${{ secrets.TEXTOS_URL_4 }}
          TEXTOS_URL_5: ${{ secrets.TEXTOS_URL_5 }}
          TEXTOS_URL_6: ${{ secrets.TEXTOS_URL_6 }}
          TEXTOS_URL_7: ${{ secrets.TEXTOS_URL_7 }}
          TEXTOS_URL_8: ${{ secrets.TEXTOS_URL_8 }}
          TEXTOS_URL_9: ${{ secrets.TEXTOS_URL_9 }}
          TEXTOS_URL_10: ${{ secrets.TEXTOS_URL_10 }}
          TEXTOS_URL_11: ${{ secrets.TEXTOS_URL_11 }}
          TEXTOS_URL_12: ${{ secrets.TEXTOS_URL_12 }}
        run: python src/cambiar_principal.py --forzar
