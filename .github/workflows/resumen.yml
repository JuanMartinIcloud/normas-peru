name: Resumen diario con IA

on:
  schedule:
    # Hora de Lima = UTC - 5. GitHub a veces se retrasa horas, por eso hay dos respaldos.
    # Si el resumen ya existe, los respaldos terminan en segundos sin hacer nada.
    - cron: "17 8 * * *"    # 3:17 a. m. Lima
    - cron: "17 10 * * *"   # 5:17 a. m. Lima (respaldo)
    - cron: "17 12 * * *"   # 7:17 a. m. Lima (respaldo)
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a resumir (YYYY-MM-DD). Vacio = ayer"
        required: false
        default: ""
      forzar:
        description: "Rehacer aunque ya exista"
        type: boolean
        default: false

concurrency:
  group: resumen
  cancel-in-progress: false

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: bash src/reintentar.sh pip install -r requirements.txt
      - name: Generar resumen
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELOS: ${{ vars.GEMINI_MODELOS }}
        run: |
          set +e
          bash src/reintentar.sh python src/resumen.py ${{ github.event.inputs.fecha }} ${{ github.event.inputs.forzar == 'true' && '--forzar' || '' }} > salida.log 2>&1
          codigo=$?
          cat salida.log
          if [ $codigo -ne 0 ]; then
            tail -n 9 salida.log | while IFS= read -r linea; do echo "::error::${linea:0:900}"; done
          fi
          exit $codigo
