name: Textos completos para el buscador

on:
  schedule:
    # Cada 4 horas. Mientras haya pendientes trabaja hasta 50 minutos; luego tarda segundos.
    - cron: "41 */4 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Antiguedad maxima de las normas a leer (dias)"
        default: "60"

concurrency:
  group: textos
  cancel-in-progress: false

jobs:
  textos:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sumillas de proyectos y textos de normas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/textos.py --max-minutos 50 --dias "${{ github.event.inputs.dias || '60' }}"
