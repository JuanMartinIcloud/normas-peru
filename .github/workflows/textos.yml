name: Textos completos para el buscador

on:
  # Ya no corre solo: la sumilla de cada proyecto ahora la guarda "Indexar textos completos".
  workflow_dispatch:
    inputs:
      dias:
        description: "Antiguedad maxima de las normas a leer (dias)"
        default: "60"

concurrency:
  group: textos
  cancel-in-progress: false

jobs:
  textos:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: el programador la detecta y la repite sola
    continue-on-error: true
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sumillas de proyectos y textos de normas
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/textos.py --max-minutos 50 --dias "${{ github.event.inputs.dias || '60' }}"
