name: Indexar textos completos

on:
  schedule:
    # Cada hora. Solo corre si el repositorio es publico (minutos ilimitados);
    # siendo privado se agotarian los 2 000 minutos gratuitos del mes.
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  indexar:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 59
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tipo: normas, parte: 0, de: 3 }
          - { tipo: normas, parte: 1, de: 3 }
          - { tipo: normas, parte: 2, de: 3 }
          - { tipo: proyectos, parte: 0, de: 1 }
    concurrency:
      group: indexar-${{ matrix.tipo }}-${{ matrix.parte }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Texto completo (${{ matrix.tipo }} ${{ matrix.parte }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEXTOS_URL_1: ${{ secrets.TEXTOS_URL_1 }}
          TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}
          TEXTOS_URL_3: ${{ secrets.TEXTOS_URL_3 }}
          TEXTOS_URL_4: ${{ secrets.TEXTOS_URL_4 }}
          TEXTOS_URL_5: ${{ secrets.TEXTOS_URL_5 }}
        run: python src/indexar.py ${{ matrix.tipo }} --parte ${{ matrix.parte }} --de ${{ matrix.de }} --max-minutos 54

  # Al terminar, si quedan documentos pendientes, vuelve a lanzarse sola (sin esperar el horario).
  # Solo con el repositorio publico, para no gastar minutos de un repositorio privado.
  relanzar:
    needs: indexar
    if: always() && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Contar pendientes
        id: cuenta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install psycopg2-binary >/dev/null
          python3 - <<'PY'
          import os, psycopg2
          c = psycopg2.connect(os.environ["DATABASE_URL"]); cur = c.cursor()
          cur.execute("""SELECT (SELECT count(*) FROM normas WHERE texto_estado IS NULL AND url_detalle IS NOT NULL)
                              + (SELECT count(*) FROM proyectos_ley WHERE texto_estado IS NULL AND num_pley IS NOT NULL)""")
          n = cur.fetchone()[0]
          print(f"Pendientes: {n}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pendientes={n}\n")
          PY
      - name: Lanzar la siguiente tanda
        if: steps.cuenta.outputs.pendientes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run indexar.yml --repo "${{ github.repository }}" --ref main
