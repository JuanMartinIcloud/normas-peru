name: Proyectos de ley (Congreso)

# Lo lanza el programador de tareas (src/programador.py) a su hora; tambien se puede lanzar a mano.
on:
  workflow_dispatch:

jobs:
  proyectos:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: el programador la detecta y la repite sola
    continue-on-error: true
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: bash src/reintentar.sh pip install -r requirements.txt
      - name: Descargar proyectos de ley
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
          TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}
        run: bash src/reintentar.sh python src/run_congreso.py
      - name: Seguimiento de expedientes (dictamenes, autografas, remisiones)
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
          TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}
        run: bash src/reintentar.sh python src/seguimiento.py --max-minutos 40
      - name: Proposiciones convertidas en ley (numero de ley, fe de erratas y enlace entre camaras)
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
          TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}
        run: bash src/reintentar.sh python src/leyes.py --max-minutos 20
