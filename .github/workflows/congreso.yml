name: Proyectos de ley (Congreso)

on:
  schedule:
    # 06:23 UTC = 1:23 a. m. Lima (respaldo 3:53 a. m.): proyectos y seguimiento listos para el
    # reporte de las 7 a. m. aunque GitHub se retrase
    - cron: "23 6 * * *"
    - cron: "53 8 * * *"
  workflow_dispatch:

jobs:
  proyectos:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar proyectos de ley
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/run_congreso.py
      - name: Seguimiento de expedientes (dictamenes, autografas, remisiones)
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/seguimiento.py --max-minutos 40
