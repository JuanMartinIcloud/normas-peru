name: Proyectos de ley (Congreso)

on:
  schedule:
    # 09:30 UTC = 04:30 hora de Lima, una vez al dia
    - cron: "30 9 * * *"
  workflow_dispatch:

jobs:
  proyectos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar proyectos de ley
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/run_congreso.py
