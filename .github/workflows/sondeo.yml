name: Sondeo de la fuente

on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python src/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe_out
          path: probe_out/
