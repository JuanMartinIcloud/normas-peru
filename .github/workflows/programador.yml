name: Programador de tareas

# Cada 30 minutos revisa la hora de Lima y lanza las tareas diarias que tocan (o repite las que fallaron).
# Hace una sola revision y termina en segundos. Ver src/programador.py.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: programador
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  programar:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Lanzar las tareas que tocan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/programador.py
