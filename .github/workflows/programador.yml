name: Programador de tareas

on:
  workflow_dispatch:
  schedule:
    # Respaldo: si la cadena se cortara, se retoma sola cada 4 horas
    - cron: "11 */4 * * *"

concurrency:
  group: programador
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  programar:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: el programador la detecta y la repite sola
    continue-on-error: true
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Vigilar la hora y lanzar las tareas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/programador.py
