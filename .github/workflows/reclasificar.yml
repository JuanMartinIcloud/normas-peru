name: Reclasificar sector y rubro

# Vuelve a clasificar sector y rubro con las reglas vigentes (src/classifier.py). Solo se lanza a mano.
# "simular" no escribe nada; "aplicar" escribe los cambios.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "simular | aplicar"
        default: "simular"

jobs:
  reclasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Reclasificar
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/reclasificar.py "${{ github.event.inputs.modo || 'simular' }}"
