name: Informe del estado

on:
  workflow_dispatch:

jobs:
  informe:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: el programador la detecta y la repite sola
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      - name: Consultar la base
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/informe.py
      - name: Detalle de proyectos de ley
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/informe.py proyectos
