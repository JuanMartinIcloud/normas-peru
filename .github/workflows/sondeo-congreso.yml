name: Sondeo del Congreso

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondeo:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: el programador la detecta y la repite sola
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sondear
        run: python src/congreso_muestra.py | tee sondeo_congreso_log.txt
      - name: Guardar resultado en el repositorio
        run: |
          git config user.name "JuanMartinIcloud"
          git config user.email "282369089+JuanMartinIcloud@users.noreply.github.com"
          cp sondeo_congreso_log.txt sondeo_congreso/log_api.txt; git add sondeo_congreso
          git commit -m "Resultado del sondeo del Congreso" || echo "sin cambios"
          git push
