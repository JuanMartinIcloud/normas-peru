name: Capturas para el manual

on:
  workflow_dispatch:

jobs:
  capturas:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash src/reintentar.sh pip install playwright==1.47.0 psycopg2-binary
      - run: bash src/reintentar.sh python -m playwright install --with-deps chromium
      - name: Tomar capturas
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/capturas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
          retention-days: 2
