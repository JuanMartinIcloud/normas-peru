name: Capturas para el manual

on:
  workflow_dispatch:
    inputs:
      script:
        description: "capturas | capturas2 | capturas3 | capturas4 | capturas5 | capturas6 | capturas7"
        default: "capturas"

jobs:
  capturas:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash src/reintentar.sh pip install playwright==1.47.0 psycopg2-binary
      - run: bash src/reintentar.sh python -m playwright install --with-deps chromium
      - name: Tomar capturas
        env:
          DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
        run: python src/${{ github.event.inputs.script || 'capturas' }}.py
      - name: Guardar cifradas
        if: always()
        run: |
          # Las capturas se cifran con la clave publica del repositorio: solo quien tiene la clave privada puede verlas
          tar czf capturas.tgz capturas
          openssl rand -hex 32 > clave.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in capturas.tgz -out capturas.tgz.enc -pass file:clave.txt
          openssl pkeyutl -encrypt -pubin -inkey capturas_publica.pem -pkeyopt rsa_padding_mode:oaep -in clave.txt -out clave.enc
          rm -f clave.txt capturas.tgz
          mkdir -p /tmp/sal && mv capturas.tgz.enc clave.enc /tmp/sal/
          # Esta rama no es la web: se le indica a Vercel que no la publique (si no, envia un correo de error)
          mkdir -p /tmp/sal/web && echo '{"git": {"deploymentEnabled": false}, "ignoreCommand": "exit 0"}' > /tmp/sal/web/vercel.json
          cd /tmp/sal && git init -q -b capturas && git add -A
          git -c user.name=JuanMartinIcloud -c user.email=noreply@github.com commit -qm "Capturas cifradas"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
