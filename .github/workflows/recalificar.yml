name: Recalificar monitoreo

# Vuelve a calificar (con los criterios vigentes) lo analizado antes: si sigue en el reporte,
# su calificacion y su puntaje de impacto del 1 al 10. Se relanza sola hasta terminar.
# Lo lanza el programador de tareas (src/programador.py) a su hora; tambien se puede lanzar a mano.
on:
  workflow_dispatch:
    inputs:
      buscar:
        description: "Opcional: solo los documentos que mencionan esta expresion (tanda pequeña)"
        default: ""

concurrency:
  group: recalificar
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.TEXTOS_URL_4 }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}

jobs:
  recalificar:
    runs-on: ubuntu-latest
    # Una falla no marca la tarea como error: se relanza o la retoma el horario
    continue-on-error: true
    timeout-minutes: 59
    outputs:
      antes: ${{ steps.antes.outputs.pendientes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: bash src/reintentar.sh pip install -r requirements.txt
      - name: Contar pendientes antes
        id: antes
        run: |
          n=$(python src/recalificar_monitoreo.py --contar | tail -n 1)
          echo "pendientes=$n" >> "$GITHUB_OUTPUT"
      - name: Recalificar
        env:
          BUSCAR: ${{ github.event.inputs.buscar }}
        run: |
          if [ -n "$BUSCAR" ]; then python src/recalificar_monitoreo.py --max-minutos 50 --buscar "$BUSCAR"
          else python src/recalificar_monitoreo.py --max-minutos 50; fi

  relanzar:
    needs: recalificar
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: bash src/reintentar.sh pip install -r requirements.txt
      - name: Contar pendientes
        id: cuenta
        run: |
          n=$(python src/recalificar_monitoreo.py --contar | tail -n 1)
          echo "Pendientes: $n"
          echo "pendientes=$n" >> "$GITHUB_OUTPUT"
      # Solo si esta tanda avanzo: si la IA no respondio o no pudo con nada, no se relanza en cadena
      # (lo retoma el programador al dia siguiente)
      - name: Lanzar la siguiente tanda
        if: steps.cuenta.outputs.pendientes != '0' && steps.cuenta.outputs.pendientes != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ANTES: ${{ needs.recalificar.outputs.antes }}
          AHORA: ${{ steps.cuenta.outputs.pendientes }}
        run: |
          if [ -n "$ANTES" ] && [ "$AHORA" -lt "$ANTES" ]; then
            gh workflow run recalificar.yml --repo "${{ github.repository }}" --ref main
          else
            echo "Esta tanda no avanzo ($ANTES -> $AHORA); no se relanza."
          fi
