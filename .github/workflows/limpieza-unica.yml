name: Limpieza unica (rotacion de bases)
on:
  workflow_dispatch:
jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests psycopg2-binary
      - name: Limpiar
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          TEXTOS_URL_2: ${{ secrets.TEXTOS_URL_2 }}
        run: python src/limpieza_unica.py
